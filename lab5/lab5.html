    //implement scene - create a three.js
    var scene = new THREE.Scene();

    //implement renderer - create a WebGL renderer for rendering the scene
    var renderer = new THREE.WebGLRenderer();
    renderer.setSize(width, height);
    //added shadows
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; //to antialias the shadow
    document.body.appendChild(renderer.domElement);

    class Sphere {

        constructor(x, y, radius, widthSphere, heightSphere, xSpeed, ySpeed) {
            this.x = x;
            this.y = y;
            this.radius = radius;
            this.widthSphere = widthSphere;
            this.heightSphere = heightSphere;
            this.xSpeed = xSpeed;
            this.ySpeed = ySpeed;
            this.sphere = null;
        }

        drawSphere(){
            const geometry = new THREE.SphereGeometry( 
                this.radius, 
                this.widthSphere, 
                this.heightSphere 
            );
            //const material = new THREE.MeshBasicMaterial( { color: 0xffff00, wireframe: false} ); 
            const material = new THREE.MeshLambertMaterial( { color: 0xFE788D} );
            this.sphere = new THREE.Mesh( geometry, material ); 
            this.sphere.position.x = this.x;
            this.sphere.position.y = this.y;
            this.sphere.position.z = 10;
            scene.add( this.sphere );
        }

        moveSphere(){
            if (!this.sphere) return;
            //rotate sphere
            this.sphere.rotation.x += 0.1;
            this.sphere.rotation.y += 0.1;
            //this.sphere.position.x += this.xSpeed;
            this.ySpeed += -0.10;
            this.sphere.position.y += this.ySpeed;
            //this.ySpeed = this.ySpeed * -1;

            //if sphere hits right side of canvas
            const limit = 50;
            if (this.sphere.position.x >= limit - this.radius / 2) {
                //this.x = 400 - radius;
                this.xSpeed = this.xSpeed * -1;
            }

            //if sphere hits left side of canvas
            if (this.sphere.position.x <= -limit + this.radius / 2) {
                //this.x = radius;
                this.xSpeed = this.xSpeed * -1;
            }

            const planeY = -30;
            //if sphere hits bottom of canvas
            if (this.sphere.position.y - this.radius <= planeY) { //has the bottom of the sphere hit the plane
                this.sphere.position.y = planeY + this.radius;
                this.ySpeed = this.ySpeed * -1;
            }

            //if sphere hits ceiling of canvas
            /* if (this.sphere.position.y + this.radius <= 500) {
                this.sphere.position.y = height - this.radius;
                this.ySpeed = this.ySpeed * -1;
            } */
        }

    }

    var sphere1 = new Sphere(20, 10, 13, 32, 20, 1, 1);
