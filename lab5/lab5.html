<!DOCTYPE html>
<html>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <head>
    <meta charset="UTF-8">
    <title>Lab 5</title>
      <style type="text/css">
      body {
          background-color: white;
      }

      canvas {
        border: 2px solid black;
      } 

    </style>
 </head>
 <body>
    <h1>Gracia</h1>
    <script type="text/javascript">
    
    //implement scene - create a three.js
    var scene = new THREE.Scene();
    var width = 800;
    var height = 800;
    //create a camera with specified properties
    var camera = new THREE.PerspectiveCamera(76, width / height, 0.1, 1000);
    //set camera position
    camera.position.z = 80;
    //implement renderer - create a WebGL renderer for rendering the scene
    var canvas = document.getElementById("canvas");
    var renderer = new THREE.WebGLRenderer();
    renderer.setSize(width, height);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry( 15, 32, 16 );
    //const material = new THREE.MeshBasicMaterial( { color: 0xffff00, wireframe: false} ); 
    const material = new THREE.MeshLambertMaterial( { color: 0x8E3CE4} );
    const sphere = new THREE.Mesh( geometry, material ); 
    scene.add( sphere );

    //call a render loop to display 3d
    var repeatMe = function () {
        renderer.render(scene, camera);
        requestAnimationFrame(repeatMe);

        //rotate sphere
        sphere.rotation.x += 0.01;
        sphere.rotation.y += 0.01;
    };
    
    repeatMe();

    var spotLight = new THREE.SpotLight(0xffffff);
    spotLight.position.set(50, 100, 150);
    scene.add(spotLight);

    </script>
 </body>
</html>
