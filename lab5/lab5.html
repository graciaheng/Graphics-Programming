<!DOCTYPE html>
<html>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <head>
    <meta charset="UTF-8">
    <title>Lab 5</title>
      <style type="text/css">
      body {
          background-color: white;
      }

      canvas {
        border: 2px solid black;
      } 

    </style>
 </head>
 <body>
    <h1>Gracia</h1>
    <script type="text/javascript">
    
    //implement scene - create a three.js
    var scene = new THREE.Scene();
    var width = 500;
    var height = 500;
    //create a camera with specified properties
    var camera = new THREE.PerspectiveCamera(76, width / height, 0.1, 1000);
    //set camera position
    camera.position.z = 80;
    //implement renderer - create a WebGL renderer for rendering the scene
    var renderer = new THREE.WebGLRenderer();
    renderer.setSize(width, height);
    document.body.appendChild(renderer.domElement);

    class Sphere {

        constructor(radius, widthSphere, heightSphere, xSpeed) {
            this.radius = radius;
            this.widthSphere = widthSphere;
            this.heightSphere = heightSphere;
            this.xSpeed = xSpeed;
            this.sphere = null;
        }

        drawSphere(){
            const geometry = new THREE.SphereGeometry( 
                this.radius, 
                this.widthSphere, 
                this.heightSphere 
            );
            //const material = new THREE.MeshBasicMaterial( { color: 0xffff00, wireframe: false} ); 
            const material = new THREE.MeshLambertMaterial( { color: 0x8E3CE4} );
            this.sphere = new THREE.Mesh( geometry, material ); 
            scene.add( this.sphere );
        }

        moveSphere(){
            if (!this.sphere) return;
            //rotate sphere
            this.sphere.rotation.x += 0.01;
            this.sphere.rotation.y += 0.01;

            this.sphere.position.x += this.xSpeed;

            //if sphere hits right side of canvas
            const limit = 50;
            if (this.sphere.position.x >= limit - this.radius / 2) {
                //this.x = 400 - radius;
                this.xSpeed = this.xSpeed * -1;
            }

            //if sphere hits left side of canvas
            if (this.sphere.position.x <= -limit + this.radius / 2) {
                //this.x = radius;
                this.xSpeed = this.xSpeed * -1;
            }
        }

    }

    var sphere1 = new Sphere(15, 32, 16, 1);
    sphere1.drawSphere();
    //call a render loop to display 3d
    var repeatMe = function () {
        renderer.render(scene, camera);
        requestAnimationFrame(repeatMe);

        sphere1.moveSphere();
    };
    
    repeatMe();

    var spotLight = new THREE.SpotLight(0xffffff);
    spotLight.position.set(50, 100, 150);
    scene.add(spotLight);

    </script>
 </body>
</html>
