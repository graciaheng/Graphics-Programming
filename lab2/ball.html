
<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
      }

      canvas {
        border: 2px solid black;
      } 

    </style>

  </head>

  <body>

    <h1>Gracia</h1>

    <canvas id="canvas-for-ball"  width="400" height="300"></canvas>

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");
      
      // The vertical location of the ball.
      var x = 50;
      var y = 30;
      var xSpeed = 3;
      var ySpeed = 3;
      var radius = 20;

      // A function to repeat every time the animation loops.
      function repeatme() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw the ball (stroked, not filled).
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, 2 * Math.PI);
        ctx.stroke();
        
        // Update the x location.
        x += xSpeed;

        // Update the y location.
        y += ySpeed;

        //if the ball hits the bottom of the canvas
        if (y >= 300 - radius){
          //ball moves up
          ySpeed = ySpeed * -1;
        } 

        //if ball hits the roof of the canvas
        if (y <= 0 + radius) {
          ySpeed = ySpeed * -1;
        }

        //if ball hits right side of canvas
        if (x >= 400 - radius) {
          xSpeed = xSpeed * -1;
        }

        //if ball hits left side of canvas
        if (x <= 0 + radius) {
          xSpeed = xSpeed * -1;
        }

   
        window.requestAnimationFrame(repeatme);
      }

      // Get the animation going.
      repeatme();
    </script>

  </body>

</html>
