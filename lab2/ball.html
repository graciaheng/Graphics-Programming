
<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
      }

      canvas {
        border: 2px solid black;
      } 

    </style>

  </head>

  <body>

    <h1>Gracia</h1>

    <canvas id="canvas-for-ball"  width="400" height="300"></canvas>

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");
      
      class Ball {

        constructor(x, y, xSpeed, ySpeed, radius) {
          //attributes
          this.x = x;
          this.y = y;
          this.xSpeed = xSpeed;
          this.ySpeed = ySpeed;
          this.radius = radius;
        }

        //draw ball
        drawBall(){
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
          ctx.stroke();
        }

        //move method
        moveBall(){
          // Update the x location.
          this.x += this.xSpeed;

          // Update the y location.
          this.y += this.ySpeed;

          //if the ball hits the bottom of the canvas
          if (this.y >= 300 - this.radius){
            //ball moves up
            this.ySpeed = this.ySpeed * -1;
          } 

          //if ball hits the roof of the canvas
          if (this.y <= 0 + this.radius) {
            this.ySpeed = this.ySpeed * -1;
          }

          //if ball hits right side of canvas
          if (this.x >= 400 - this.radius) {
            this.xSpeed = this.xSpeed * -1;
          }

          //if ball hits left side of canvas
          if (this.x <= 0 + this.radius) {
            this.xSpeed = this.xSpeed * -1;
          }
        }

      }

      var b1 = new Ball(50, 30, 3, 3, 20);

      // A function to repeat every time the animation loops.
      function repeatme() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        b1.drawBall();
        b1.moveBall();

        window.requestAnimationFrame(repeatme);
      }

      // Get the animation going.
      repeatme();
    </script>

  </body>

</html>
