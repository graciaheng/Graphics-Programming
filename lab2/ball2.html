<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pac-Man rotating around its center</title>
  <style>
    body { font-family: sans-serif; }
    canvas { border: 2px solid #000; display:block; margin-top:10px; }
  </style>
</head>
<body>
  <h1>Pac-Man rotating around its center</h1>
  <canvas id="canvas" width="400" height="300"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    class PacMan {
      constructor(x, y, vx, vy, r){
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.r = r;
        this.angle = 0;            // rotation angle (radians)
      }

      draw(){
        // ALWAYS save before doing translate/rotate and restore after
        ctx.save();
        // Move origin to Pac-Man's CENTER
        ctx.translate(this.x, this.y);
        // Rotate the coordinate system around that center
        ctx.rotate(this.angle);

        // mouth animation (relative to rotated coordinate system)
        const mouth = Math.abs(Math.sin(Date.now() / 200)) * 0.6; // radians
        const start = mouth;
        const end = Math.PI * 2 - mouth;

        // draw body (centered at 0,0 because we translated)
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, this.r, start, end, false);
        ctx.closePath();
        ctx.fillStyle = 'yellow';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'black';
        ctx.stroke();

        // draw an "eye" so rotation is obvious
        ctx.beginPath();
        // eye positioned relative to center (0,0) and will rotate with the body
        ctx.arc(this.r * 0.35, -this.r * 0.45, this.r * 0.12, 0, Math.PI * 2);
        ctx.fillStyle = 'black';
        ctx.fill();

        ctx.restore();
      }

      update(){
        // move
        this.x += this.vx;
        this.y += this.vy;

        // rotate around own center
        this.angle += 0.18; // make this larger/smaller to speed up/slow down spin

        // bounce off edges (simple)
        if (this.x >= canvas.width - this.r) { this.x = canvas.width - this.r; this.vx *= -1; }
        if (this.x <= this.r)                     { this.x = this.r;                   this.vx *= -1; }
        if (this.y >= canvas.height - this.r) { this.y = canvas.height - this.r; this.vy *= -1; }
        if (this.y <= this.r)                     { this.y = this.r;                   this.vy *= -1; }
      }
    }

    const p = new PacMan(80, 60, 3, 2.5, 24);

    function loop(){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      p.update();
      p.draw();

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
