<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      canvas {
        border: 2px solid black;
      } 
	
    </style>

  </head>

  <body>

    <canvas id="canvasOne" width="600" height="600">

    </canvas>

    <script type="text/javascript">

    // Gets a handle to the element with id canvasOne.
    var c = document.getElementById("canvasOne");

    // Set the canvas up for drawing in 2D.
    var ctx = c.getContext("2d");

    // Set the fill colour to pink.
    ctx.fillStyle = "pink";

    // Create a filled rectangle
    ctx.fillRect(40, 130, 150, 100); 
    
    //draws name into the canvas
    ctx.font = "25px Arial";
    ctx.fillStyle = "blue";
    ctx.fillText("Gracia",10,30);

    //draws a triangle
    ctx.beginPath();
    //sets the starting point
    ctx.moveTo(100,200);
    ctx.lineTo(50,300);
    ctx.lineTo(150,300);
    ctx.lineTo(100,200); //goes back to starting point
    ctx.fillStyle = "rgba(255, 255, 129, 0.7)";
    ctx.fill();

    //draws circle 1
    ctx.beginPath();
    ctx.arc(175, 150, 40, 0, 2 * Math.PI);
    ctx.fillStyle = "rgba(150, 255, 129, 0.7)";
    ctx.fill();
    ctx.stroke();

    //drass circle 2
    ctx.beginPath();
    ctx.arc(60, 150, 50, 0, 2 * Math.PI);
    ctx.fillStyle = "rgba(150, 220, 255, 0.7)";
    ctx.fill();
    ctx.strokeStyle = "purple";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Define a square
    ctx.moveTo(200,200);
    ctx.lineTo(400,200);
    ctx.lineTo(400,400);
    ctx.lineTo(200,400);
    ctx.lineTo(200,200);

    // Define a triangle
    ctx.moveTo(300,200);
    ctx.lineTo(400,400);
    ctx.lineTo(200,400);
    ctx.lineTo(300,200);

    ctx.stroke();

    //Pac Man
    cx = 475;
    cy = 90;
    r = 50;
    angle1 = 5*Math.PI/4;
    angle2 = 7*Math.PI/4;
    ctx.beginPath();
    //false -clockwise //true -anticlockwise
    ctx.arc(cx,cy,r,angle1,angle2,true);

    ctx.moveTo(cx,cy);

    //add the value of the x-value and y in the center
    x1 = (r*Math.cos(angle1))+cx;
    y1 = (r*Math.sin(angle1))+cy;

    ctx.lineTo(x1,y1);
    ctx.moveTo(cx,cy); //goes back to center of it

    x2 = (r*Math.cos(angle2))+cx;
    y2 = (r*Math.sin(angle2))+cy;
    ctx.lineTo(x2,y2);
    ctx.strokeStyle = "rgb(200,100,100)";
    //ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.stroke();
         if (y <= 300 - radius){
          ySpeed=-ySpeed * -1;
        }
    </script>

  </body>

</html>
