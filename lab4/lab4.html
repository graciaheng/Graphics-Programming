
<!DOCTYPE html>

<html>

<script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
      }

      canvas {
        border: 2px solid black;
      } 

    </style>

  </head>

  <body>

    <h1>Gracia</h1>

    <canvas id="canvas-for-ball"  width="400" height="300"></canvas>

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");

      var angle = 0;


      class Paddle {

        constructor(x, y, radius, sAngle, eAngle) {
            this.x = x;
            this.y = y;
            this.radius = radius;
            this.sAngle = sAngle;
            this.eAngle = eAngle;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, this.sAngle, this.eAngle, true);
            ctx.stroke();
        }

      }

      class Ball {

        constructor(x, y, xSpeed, ySpeed, radius, angle1, angle2) {
          //attributes
          this.x = x;
          this.y = y;
          this.xSpeed = xSpeed;
          this.ySpeed = ySpeed;
          this.radius = radius;
          this.angle1 = angle1;
          this.angle2 = angle2;
          this.angle = 0;
          this.rotation = 0.05;
          this.gravity = 0.2;
        }

        //draw ball
        drawBall(){

          ctx.save(); 
          //move the center to the circle's center
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);

          //Pac Man
          this.angle1 = 5.25 * Math.PI / 4;
          this.angle2 = 7 * Math.PI / 4;
          
          ctx.beginPath();
          ctx.moveTo(0,0);
          //false -clockwise //true -anticlockwise
          ctx.arc(0, 0, this.radius, this.angle1, this.angle2, true);

          //add the value of the x-value and y in the center
          var x1 = (this.radius * Math.cos(this.angle1));
          var y1 = (this.radius * Math.sin(this.angle1));

          ctx.lineTo(0,0);
          ctx.lineTo(x1,y1); 

          var x2 = (this.radius * Math.cos(this.angle2));
          var y2 = (this.radius * Math.sin(this.angle2));
          ctx.moveTo(0,0);
          ctx.lineTo(x2,y2); 

          ctx.stroke();

          ctx.restore();
        }

        //move method
        moveBall(){

          // Update the x location.
          this.x += this.xSpeed;

          this.ySpeed += this.gravity;
          // Update the y location.
          this.y += this.ySpeed;

          this.angle += this.rotation;

          //if the ball hits the bottom of the canvas
          if (this.y >= 300 - this.radius){
            this.y = 300 - this.radius; //keep the ball from staying within the canvas
            this.ySpeed *= -0.9;    //ball moves up only 90%
            this.angle *= -1;
          } 

          //if ball hits the roof of the canvas
          if (this.y <= 0 + this.radius) {
            this.y = this.radius;
            this.ySpeed *= -0.9;
            this.angle *= -1;
          }

          //if ball hits right side of canvas
          if (this.x >= 400 - this.radius) {
            this.x = 400 - this.radius;
            this.xSpeed = this.xSpeed * -1;
            this.angle *= -1;
          }

          //if ball hits left side of canvas
          if (this.x <= 0 + this.radius) {
            this.x = this.radius;
            this.xSpeed = this.xSpeed * -1;
            this.angle *= -1;
          }
        }
      }

      var b1 = new Ball(50, 30, 3, 3, 20, 0, 0);
      var paddle1 = new Paddle(20, 20, 10, 0, 2 * Math.PI);
      var paddle2 = new Paddle(350, 20, 10, 0, 2 * Math.PI);

      // A function to repeat every time the animation loops.
      function repeatme() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        paddle1.draw();
        paddle2.draw();
        b1.drawBall();
        b1.moveBall();

        window.requestAnimationFrame(repeatme);
      }

      // Get the animation going.
      repeatme();

      //calculate position of the canvas DOM element on the page
      var canvasPosition = {
        x: canvas.offsetLeft,
        y: canvas.offsetTop
      }

      canvas.addEventListener("click", function(event) {

        var mouse = {
          x: event.clientX - canvasPosition.x,
          y: event.clientY - canvasPosition.y
        }
        console.log(mouse);

        paddle.y = mouse.y; //move y coordinates
 
      });

      //keypresses with jQuery
	   $(document.body).on('keydown', function(e) {
		console.log(e.which);
		switch (e.which) {

		// key code for left arrow
		case 37:
        paddle1.x--;
		console.log('left arrow key pressed!');
		break;

	    // key code for right arrow
		case 39:
        paddle1.x++;
		console.log('right arrow key pressed!');
		break;

        //key code for J / left
        case 74:
        paddle2.x--;
		console.log('J arrow key pressed!');
		break;

	    // key code for L / right
		case 76:
        paddle2.x++;
		console.log('L arrow key pressed!');
		break;

        //key code for I / up
        case 73:
        paddle2.y--;
		console.log('I arrow key pressed!');
		break;

	    // key code for K / down
	    case 75:
        paddle2.y++;
		console.log('K arrow key pressed!');
		break;

        //key code for + 
        case 187:
        b1.rotation += 0.01; //update speed slowly
        console.log('+ arrow key pressed!');
        break;

        //key code for -
        case 189:
        b1.rotation -= 0.01; //update speed slowly
        console.log('- arrow key pressed!');
        break;
		}

	});

    </script>

  </body>

</html>
