
<!DOCTYPE html>

<html>

<script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>

  <head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style type="text/css">
      body {
          background-color: white;
      }

      canvas {
        border: 2px solid black;
      } 

    </style>

  </head>

  <body>

    <h1>Gracia</h1>

    <canvas id="canvas-for-ball"  width="400" height="300"></canvas>

    <h3 id="score1">Paddle 1: 0</h3>
    <h3 id="score2">Paddle 2: 0</h3>
    <h3 id="message"></h3> <!-- collision message -->

    <script type="text/javascript">
      // Gets a handle to the element with id canvasOne.
      var canvas = document.getElementById("canvas-for-ball");
      // Get a 2D context for the canvas.
      var ctx = canvas.getContext("2d");

      var angle = 0;

      class Paddle {

        constructor(x, y, radius, sAngle, eAngle) {
            this.x = x;
            this.y = y;
            this.radius = radius;
            this.sAngle = sAngle;
            this.eAngle = eAngle;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, this.sAngle, this.eAngle, true);
            // create a radial gradient for the Pac-Man
            const gradient = ctx.createRadialGradient(
            this.x, this.y, this.radius * 0.2, // inner circle
            this.x, this.y, this.radius        // outer circle
            );
            gradient.addColorStop(0, "#ffb6c1");  // light pink center
            gradient.addColorStop(1, "#ff1493");  // deep pink edge

            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = "#ff1493";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

      }

      class Ball {

        constructor(x, y, xSpeed, ySpeed, radius, angle1, angle2) {
          //attributes
          this.x = x;
          this.y = y;
          this.xSpeed = xSpeed;
          this.ySpeed = ySpeed;
          this.radius = radius;
          this.angle1 = angle1;
          this.angle2 = angle2;
          this.angle = 0;
          this.rotation = 0.05;
          this.gravity = 0.2;
        }

        //draw ball
        drawBall(){

          ctx.save(); 
          //move the center to the circle's center
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);

          //Pac Man
          this.angle1 = 5.25 * Math.PI / 4;
          this.angle2 = 7 * Math.PI / 4;
          
          ctx.beginPath();
          ctx.moveTo(0,0);
          //false -clockwise //true -anticlockwise
          ctx.arc(0, 0, this.radius, this.angle1, this.angle2, true);

          //add the value of the x-value and y in the center
          var x1 = (this.radius * Math.cos(this.angle1));
          var y1 = (this.radius * Math.sin(this.angle1));

          ctx.lineTo(0,0);
          ctx.lineTo(x1,y1); 

          var x2 = (this.radius * Math.cos(this.angle2));
          var y2 = (this.radius * Math.sin(this.angle2));
          ctx.moveTo(0,0);
          ctx.lineTo(x2,y2); 

          ctx.stroke();
          ctx.fillStyle = "rgb(255, 150, 200)";
          ctx.fill();

          ctx.restore();
        }

        //move method
        moveBall(){

          // Update the x location.
          this.x += this.xSpeed;

          this.ySpeed += this.gravity;
          // Update the y location.
          this.y += this.ySpeed;

          this.angle += this.rotation;

          //if the ball hits the bottom of the canvas
          if (this.y >= 300 - this.radius){
            this.y = 300 - this.radius; //keep the ball from staying within the canvas
            this.ySpeed = this.ySpeed * -1;    //ball moves up only 90%
            this.angle *= -1;

          } 

          //if ball hits the roof of the canvas
          if (this.y <= 0 + this.radius) {
            this.y = this.radius;
            this.ySpeed = this.ySpeed * -1;
            this.angle *= -1;
          }

          //if ball hits right side of canvas
          if (this.x >= 400 - this.radius) {
            this.x = 400 - this.radius;
            this.xSpeed = this.xSpeed * -1;
            this.angle *= -1;
            score2--;
            document.getElementById("score2").innerText = "Paddle 2: " + score2;
          }

          //if ball hits left side of canvas
          if (this.x <= 0 + this.radius) {
            this.x = this.radius;
            this.xSpeed = this.xSpeed * -1;
            this.angle *= -1;
            score1--;
            document.getElementById("score1").innerText = "Paddle 1: " + score1;
          }
        }
      }

      var balls = [new Ball(50, 30, 3, 3, 20)];
      balls.push(new Ball(50, 30, 3, 3, 20, 0, 0));
      var paddle1 = new Paddle(40, 149, 20, 0, 2 * Math.PI);
      var paddle2 = new Paddle(350, 149, 20, 0, 2 * Math.PI);
      var score1 = 0;
      var score2 = 0;

      // A function to repeat every time the animation loops.
      function repeatme() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        paddle1.draw();
        paddle2.draw();

        for (let i = 0; i < balls.length; i++) {
          const b = balls[i];
          b.drawBall();
          b.moveBall();
          collisionDetect(b); // pass ball to collision function
        }

        window.requestAnimationFrame(repeatme);
      }

      // Get the animation going.
      repeatme();

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function collisionDetect(b) {
        //determine distance between both circle's points
        var distance1 = Math.sqrt((paddle1.x - b.x) ** 2 + 
                       (paddle1.y - b.y) ** 2);

        //determine the sum of both radius
        var sumRad1 = paddle1.radius + b.radius;

        //determine distance between both circle's points
        var distance2 = Math.sqrt((paddle2.x - b.x) ** 2 + 
                       (paddle2.y - b.y) ** 2);

        //determine the sum of both radius
        var sumRad2 = paddle2.radius + b.radius;

        if (distance1 <= sumRad1) {
            document.getElementById("message").innerText = "Collision Detected 1!";
            rebound(b, 1, 0);
            score1++;
            document.getElementById("score1").innerText = "Paddle 1: " + score1;
        }
        else if (distance2 <= sumRad2) {
            document.getElementById("message").innerText = "Collision Detected 2!";
            rebound(b, 0, 1);
            score2++;
            document.getElementById("score2").innerText = "Paddle 2: " + score2;
        }
        else {
            document.getElementById("message").innerText = "";
        }

      }

      function rebound (b, hit1, hit2) {
        b.xSpeed = b.xSpeed * -1;
        if (hit1 == 1) {
            b.x += 20;
        }
        if (hit2 == 1) {
           b.x -= 20;
        }
        b.ySpeed = b.ySpeed * -1;
      }

      //calculate position of the canvas DOM element on the page
      var canvasPosition = {
        x: canvas.offsetLeft,
        y: canvas.offsetTop
      }

      canvas.addEventListener("click", function(event) {

        var mouse = {
          x: event.clientX - canvasPosition.x,
          y: event.clientY - canvasPosition.y
        }
        console.log(mouse);

        paddle1.y = mouse.y; //move y coordinates
 
      });

      //keypresses with jQuery
	  $(document.body).on('keydown', function(e) {
		console.log(e.which);
		switch (e.which) {

		// key code for left arrow
		case 37: paddle1.x--; break;

	    // key code for right arrow
		case 39: paddle1.x++; break;

        //key code for J / left
    case 74: paddle2.x--; break;

	    // key code for L / right
		case 76: paddle2.x++; break;

        //key code for I / up
    case 73: paddle2.y--; break;

	    // key code for K / down
	  case 75: paddle2.y++; break;

        //key code for + 
    case 187: b1.rotation += 0.01; break; //update speed slowly

        //key code for -
    case 189: b1.rotation -= 0.01; break; //update speed slowlybreak;
		
    // N key → Add new match ball!
    case 78:
        const newBall = new Ball(
          Math.random() * canvas.width,
          Math.random() * canvas.height / 2,
          (Math.random() - 0.5) * 6,
          (Math.random() - 0.5) * 6,
          20
        );
        balls.push(newBall);
        console.log("New ball added! Total balls:", balls.length);
        break;
  }

        // Clamp paddle1 position
        paddle1.x = clamp(paddle1.x, paddle1.radius, canvas.width - paddle1.radius);
        paddle1.y = clamp(paddle1.y, paddle1.radius, canvas.height - paddle1.radius);

        // Clamp paddle2 position
        paddle2.x = clamp(paddle2.x, paddle2.radius, canvas.width - paddle2.radius);
        paddle2.y = clamp(paddle2.y, paddle2.radius, canvas.height - paddle2.radius);

	});

    </script>

  </body>

</html>
